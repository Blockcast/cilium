name: Multicast EGW Regression Test

on:
  pull_request:
    branches:
      - feat/l2fix-mcast-v3-sip-egress
    paths:
      - '.github/workflows/bpf-focused-mcast-test.yaml'
      - 'bpf/**'
      - 'pkg/egressgateway/**'
      - 'pkg/maps/egressmap/**'
  workflow_dispatch:

permissions: read-all

jobs:
  multicast_egw_regression:
    name: BPF and Go multicast EGW regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Git status and log
        run: |
          echo "=== git status ==="
          git status --short --branch
          echo ""
          echo "=== git log ==="
          git log --oneline -5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install Python deps for Scapy packet generation
        run: |
          pip3 install --quiet scapy Jinja2

      - name: Run multicast and unicast CEGP BPF regressions
        shell: bash
        run: |
          set -o pipefail

          # Guard against a renamed/removed test object silently shrinking the
          # BPF_TEST regex match below while the job still exits 0. This checks
          # source-file presence rather than grepping runtime test-runner output:
          # the `make run_bpf_tests` pipeline formats results through `tparse`,
          # which does not emit a `--- PASS: <name>` line per object, so asserting
          # against that text is unreliable. Checking that each required object's
          # source still exists (and thus still gets compiled and matched by the
          # BPF_TEST regex below) gives the same regression protection.
          for obj in tc_egressgw_origin_node_multicast tc_egressgw_redirect_multicast \
                     tc_egressgw_redirect_from_host tc_egressgw_redirect_from_overlay \
                     tc_egressgw_redirect_from_overlay_with_egress_interface tc_egressgw_snat; do
            if [ ! -f "bpf/tests/${obj}.c" ]; then
              echo "Required BPF test source bpf/tests/${obj}.c is missing — BPF_TEST regex match would silently shrink" >&2
              exit 1
            fi
          done

          # BPF_TEST is a regex over test object names. This one invocation
          # includes both multicast tests and every existing unicast
          # tc_egressgw* regression in a single test receipt.
          make run_bpf_tests \
            BPF_TEST='tc_egressgw' \
            BPF_TEST_VERBOSE=1 \
            | tee /tmp/bpf-egressgw-test.log

          if grep -q -- '--- SKIP:' /tmp/bpf-egressgw-test.log; then
            echo 'BPF egress gateway test unexpectedly skipped' >&2
            exit 1
          fi

          # Belt-and-suspenders: fail loudly (rather than silently pass) if the
          # test runner's summary format ever changes shape and we can no longer
          # find any pass/fail/skip tally at all in the captured output.
          if ! grep -qE 'PASS.*FAIL.*SKIP|ok[[:space:]]+github.com/cilium/cilium/bpf/tests/bpftest' /tmp/bpf-egressgw-test.log; then
            echo 'Could not find a recognizable BPF test summary in the output — treating as a failure' >&2
            exit 1
          fi

      - name: Run CEGP validation and reconciliation regressions
        shell: bash
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" PRIVILEGED_TESTS=1 \
            go test -v -count=1 -timeout=10m ./pkg/egressgateway \
            -run '^(TestParseCEGPMulticastDestinationCIDRs|TestPrivilegedEgressGatewayCEGPParser|TestPrivilegedEgressGatewayManager|TestPrivilegedMulticastEgressGatewayManager)$' \
            | tee /tmp/multicast-egw-go-test.log

          if grep -q -- '--- SKIP:' /tmp/multicast-egw-go-test.log; then
            echo 'Privileged reconciliation test unexpectedly skipped' >&2
            exit 1
          fi
