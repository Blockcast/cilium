name: Build L2 Fix Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/ref to build'
        required: false
        default: 'omar/feat-l2fix-rev6-v1.19.3'
      tag:
        description: 'Image tag'
        required: true
        default: 'v1.19.3-l2fix-mcast-sip-egress-rev6'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    timeout-minutes: 60
    name: Build and Push Cilium Image
    runs-on: large
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to harbor.blockcast.net
        uses: docker/login-action@v3
        with:
          registry: harbor.blockcast.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # registry.blockcast.net is the alias ingress in front of the same
      # Harbor backend, but the docker registry auth realm advertised on
      # the /v2/ endpoint is hostname-scoped, so a separate login is
      # required for the dual-tag push to succeed.
      - name: Log in to registry.blockcast.net (alias)
        uses: docker/login-action@v3
        with:
          registry: registry.blockcast.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and Push cilium agent
        uses: docker/build-push-action@v6
        with:
          provenance: false
          context: .
          file: ./images/cilium/Dockerfile
          push: true
          platforms: linux/amd64
          # Post-2026-05-17 harbor cutover: harbor.blockcast.net is canonical.
          # The cluster still pulls via registry.blockcast.net (alias ingress),
          # so push under both names — kubelet matches the image hostname
          # verbatim against the local cache.
          tags: |
            harbor.blockcast.net/blockcast/cilium:${{ inputs.tag }}
            registry.blockcast.net/blockcast/cilium:${{ inputs.tag }}
          target: release
