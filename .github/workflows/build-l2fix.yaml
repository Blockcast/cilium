name: Build L2 Fix Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: true
        default: 'v1.19.1-l2fix'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    timeout-minutes: 60
    name: Build and Push Cilium Image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: fix/l2-responder-stale-vip-cleanup
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push cilium agent
        uses: docker/build-push-action@v6
        with:
          provenance: false
          context: .
          file: ./images/cilium/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/blockcast/cilium:${{ github.event.inputs.tag }}
          target: release
