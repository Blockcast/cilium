# Builds the Blockcast L2-fix / multicast Cilium image and pushes it to
# registry.blockcast.net.
#
# Registry auth: registry.blockcast.net has been Harbor since the 2026-05-17
# zot -> Harbor cutover. The pre-cutover zot htpasswd pair
# (`ci-cache` + `LOCAL_REGISTRY_PASSWORD`) no longer authenticates and is not
# coming back; the org-wide post-cutover pair is
# `HARBOR_USERNAME` + `HARBOR_PASSWORD`, exercised hourly by
# Blockcast/onprem-k8s `.github/workflows/canary-local-registry-login.yaml`.
# Do not reintroduce the zot pair here.
#
# Source ref: this workflow file lives only on the default branch, so the
# dispatch ref selects the *workflow*, not the source. `source_ref` selects the
# source explicitly. It used to be hard-pinned to the prototype branch
# `fix/l2-responder-stale-vip-cleanup`, which silently built the wrong tree.
# `source_ref` therefore carries NO default: a dispatch that omits it must fail
# loudly rather than fall back to whichever branch was current when this file
# was last edited.
#
# Version stamping (BLO-51992): `source_ref` must be a semver git TAG on a
# clean tree, e.g. `v1.20.0-l2fix-mcast-egw-v4`. Go stamps the main-module
# version from VCS, so an untagged commit is stamped `v0.0.0-<date>-<sha>` and a
# modified tree gets `+dirty`. Trivy reads that version and matches it against
# every upstream `github.com/cilium/cilium` advisory range, so Harbor reports
# every Cilium CVE as Critical whether or not the fix is in our tree. The
# verify step below reads the built binary's buildinfo and refuses to push
# unless the version is exactly the tag. Tag the commit first:
#   git tag v1.20.0-l2fix-<line>-vN <sha> && git push origin v1.20.0-l2fix-<line>-vN

name: Build L2 Fix Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: true
        default: 'v1.19.1-l2fix'
      source_ref:
        description: 'Git tag to build (semver, e.g. v1.20.0-l2fix-mcast-egw-v4). Branches and SHAs are refused.'
        required: true

permissions:
  contents: read

jobs:
  build-and-push:
    timeout-minutes: 60
    name: Build and Push Cilium Image
    runs-on:
      group: default-tools
      labels: arc-dind
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.inputs.source_ref }}
          persist-credentials: false

      - name: Record build source
        env:
          SOURCE_REF: ${{ github.event.inputs.source_ref }}
        run: |
          set -euo pipefail
          echo "requested source_ref: $SOURCE_REF"
          echo "resolved commit:      $(git rev-parse HEAD)"
          git log --oneline -1
          test "$(git describe --exact-match --tags HEAD)" = "$SOURCE_REF"
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain; echo "::error::tree is dirty; Go would stamp +dirty"; exit 1
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry.blockcast.net
        uses: docker/login-action@v3
        with:
          registry: registry.blockcast.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build cilium agent
        uses: docker/build-push-action@v6
        with:
          provenance: false
          context: .
          file: ./images/cilium/Dockerfile
          load: true
          platforms: linux/amd64
          tags: registry.blockcast.net/blockcast/cilium:${{ github.event.inputs.tag }}
          target: release

      - name: Verify cilium-agent Go module version is the tag
        env:
          IMAGE: registry.blockcast.net/blockcast/cilium:${{ github.event.inputs.tag }}
          SOURCE_REF: ${{ github.event.inputs.source_ref }}
        run: |
          set -euo pipefail
          cid=$(docker create "$IMAGE")
          docker cp "$cid:/usr/bin/cilium-agent" ./cilium-agent.verify
          docker rm "$cid" >/dev/null
          go version -m ./cilium-agent.verify | grep -E '^\s*(mod|build\s+vcs)'
          got=$(go version -m ./cilium-agent.verify | awk '$1=="mod" && $2=="github.com/cilium/cilium" {print $3}')
          if [ "$got" != "$SOURCE_REF" ]; then
            echo "::error::cilium-agent main-module version is '$got', want '$SOURCE_REF' (pseudo-version or +dirty makes Harbor flag every upstream Cilium CVE)"
            exit 1
          fi

      - name: Push cilium agent
        run: docker push "registry.blockcast.net/blockcast/cilium:${{ github.event.inputs.tag }}"
