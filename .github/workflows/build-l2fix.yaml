name: Build L2 Fix Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/ref to build'
        required: false
        default: 'feat/l2fix-mcast'
      tag:
        description: 'Image tag'
        required: true
        default: 'v1.19.3-l2fix+mcast-v1'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    timeout-minutes: 60
    name: Build and Push Cilium Image
    runs-on: large
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry.blockcast.net
        uses: docker/login-action@v3
        with:
          registry: registry.blockcast.net
          username: ci-cache
          password: ${{ secrets.LOCAL_REGISTRY_PASSWORD }}

      - name: Build and Push cilium agent
        uses: docker/build-push-action@v6
        with:
          provenance: false
          context: .
          file: ./images/cilium/Dockerfile
          push: true
          platforms: linux/amd64
          tags: registry.blockcast.net/blockcast/cilium:${{ github.event.inputs.tag }}
          target: release
